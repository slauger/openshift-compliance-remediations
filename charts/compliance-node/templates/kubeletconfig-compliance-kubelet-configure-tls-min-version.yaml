{{- define "cr.frag.kubeletconfig-compliance-kubelet-configure-tls-min-version.ocp4-kubelet-configure-tls-min-version.0" -}}
spec:
  kubeletConfig:
    tlsMinVersion: "{{ .Values.variables.var_kubelet_tls_min_version }}"
{{- end -}}

{{- /* KubeletConfig/compliance-kubelet-configure-tls-min-version - rule(s): ocp4-kubelet_configure_tls_min_version */ -}}
{{- if and (.Values.node.enabled) (eq (include "cr.anyActive" (dict "root" . "rules" (list "ocp4-kubelet_configure_tls_min_version"))) "true") -}}
{{- $merged := dict -}}
{{- if eq (include "cr.ruleActive" (dict "root" . "rule" "ocp4-kubelet_configure_tls_min_version")) "true" -}}
{{- $frag := include "cr.frag.kubeletconfig-compliance-kubelet-configure-tls-min-version.ocp4-kubelet-configure-tls-min-version.0" . | fromYaml -}}
{{- $merged = mustMergeOverwrite $merged $frag -}}
{{- end -}}
{{- range $role := (.Values.node.roles | uniq) }}
---
apiVersion: machineconfiguration.openshift.io/v1
kind: KubeletConfig
metadata:
  name: {{ printf "%s-%s" "compliance-kubelet-configure-tls-min-version" $role }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
    compliance.openshift.io/managed: "true"
    machineconfiguration.openshift.io/role: {{ $role | quote }}
{{ $merged | toYaml }}
{{- end }}
{{- end -}}
