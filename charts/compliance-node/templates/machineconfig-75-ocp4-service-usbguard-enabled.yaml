{{- define "cr.frag.machineconfig-75-ocp4-service-usbguard-enabled.rhcos4-service-usbguard-enabled.0" -}}
spec:
  config:
    ignition:
      version: 3.1.0
    systemd:
      units:
      - name: usbguard.service
        enabled: true
{{- end -}}

{{- /* MachineConfig/75-ocp4-service-usbguard-enabled - rule(s): rhcos4-service_usbguard_enabled */ -}}
{{- if and (.Values.node.enabled) (eq (include "cr.anyActive" (dict "root" . "rules" (list "rhcos4-service_usbguard_enabled"))) "true") -}}
{{- $merged := dict -}}
{{- if eq (include "cr.ruleActive" (dict "root" . "rule" "rhcos4-service_usbguard_enabled")) "true" -}}
{{- $frag := include "cr.frag.machineconfig-75-ocp4-service-usbguard-enabled.rhcos4-service-usbguard-enabled.0" . | fromYaml -}}
{{- $merged = mustMergeOverwrite $merged $frag -}}
{{- end -}}
{{- if not $merged -}}
{{- fail (printf "No remediation applies to MachineConfig/75-ocp4-service-usbguard-enabled at cluster.ocpVersion %s. Every fix variant of the active rule(s) (rhcos4-service_usbguard_enabled) is constrained to a different OpenShift version. Disable the rule(s) or set a supported cluster.ocpVersion." (.Values.cluster.ocpVersion | toString)) -}}
{{- end -}}
{{- range $role := (.Values.node.roles | uniq) }}
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: {{ printf "%s-%s" "75-ocp4-service-usbguard-enabled" $role }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
    compliance.openshift.io/managed: "true"
    machineconfiguration.openshift.io/role: {{ $role | quote }}
{{ $merged | toYaml }}
{{- end }}
{{- end -}}
