{{- define "cr.frag.machineconfig-75-ocp4-coreos-audit-option.rhcos4-coreos-audit-option.0" -}}
spec:
  config:
    ignition:
      version: 3.1.0
  kernelArguments:
    - audit=1
{{- end -}}

{{- /* MachineConfig/75-ocp4-coreos-audit-option - rule(s): rhcos4-coreos_audit_option */ -}}
{{- if and (.Values.node.enabled) (eq (include "cr.anyActive" (dict "root" . "rules" (list "rhcos4-coreos_audit_option"))) "true") -}}
{{- $merged := dict -}}
{{- $fileAcc := dict -}}
{{- if eq (include "cr.ruleActive" (dict "root" . "rule" "rhcos4-coreos_audit_option")) "true" -}}
{{- $frag := include "cr.frag.machineconfig-75-ocp4-coreos-audit-option.rhcos4-coreos-audit-option.0" . | fromYaml -}}
{{- if hasKey $frag "Error" -}}
{{- fail (printf "Rendering rhcos4-coreos_audit_option for MachineConfig/75-ocp4-coreos-audit-option produced invalid YAML: %s. Check the variables it interpolates." $frag.Error) -}}
{{- end -}}
{{- range $f := (dig "spec" "config" "storage" "files" (list) $frag) -}}
{{- $prev := index $fileAcc ($f.path | toString) -}}
{{- if and $prev (ne (toJson $prev) (toJson $f)) -}}
{{- fail (printf "Conflicting content for %s in MachineConfig/75-ocp4-coreos-audit-option: rhcos4-coreos_audit_option writes it differently than another active rule does. Both cannot apply - enable only one, or pick the variant that matches your cluster.ocpVersion." $f.path) -}}
{{- end -}}
{{- $_ := set $fileAcc ($f.path | toString) $f -}}
{{- end -}}
{{- $merged = mustMergeOverwrite $merged $frag -}}
{{- end -}}
{{- if $fileAcc -}}
{{- $files := list -}}
{{- range $p := (keys $fileAcc | sortAlpha) -}}
{{- $files = append $files (index $fileAcc $p) -}}
{{- end -}}
{{- $merged = mustMergeOverwrite $merged (dict "spec" (dict "config" (dict "storage" (dict "files" $files)))) -}}
{{- end -}}
{{- if not $merged -}}
{{- fail (printf "No remediation applies to MachineConfig/75-ocp4-coreos-audit-option at cluster.ocpVersion %s. Every fix variant of the active rule(s) (rhcos4-coreos_audit_option) is constrained to a different OpenShift version. Disable the rule(s) or set a supported cluster.ocpVersion." (.Values.cluster.ocpVersion | toString)) -}}
{{- end -}}
{{- range $role := (.Values.node.roles | uniq) }}
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: {{ printf "%s-%s" "75-ocp4-coreos-audit-option" $role }}
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name | quote }}
    app.kubernetes.io/instance: {{ $.Release.Name | trunc 63 | trimSuffix "-" | quote }}
    app.kubernetes.io/component: remediation
    app.kubernetes.io/part-of: compliance-hardening
    app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
    machineconfiguration.openshift.io/role: {{ $role | quote }}
{{ $merged | toYaml }}
{{- end }}
{{- end -}}
