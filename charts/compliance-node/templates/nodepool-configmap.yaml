{{- if gt (len $docs) 1048576 -}}
{{- fail (printf "node.output=nodepool renders %d bytes, over the %d a ConfigMap can hold. Enable fewer profiles, or render the excess into a second release, which gets its own ConfigMap name." (len $docs) 1048576) -}}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name | quote }}
  namespace: {{ .Values.node.nodePool.namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | trunc 63 | trimSuffix "-" | quote }}
    app.kubernetes.io/component: remediation
    app.kubernetes.io/part-of: compliance-hardening
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
data:
  config: |-
{{ $docs | indent 4 }}
{{- end -}}
{{- if $kubelet }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ (printf "%s-kubelet" $name) | quote }}
  namespace: {{ .Values.node.nodePool.namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | trunc 63 | trimSuffix "-" | quote }}
    app.kubernetes.io/component: remediation
    app.kubernetes.io/part-of: compliance-hardening
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
data:
  config: |-
{{ $kubelet | indent 4 }}
{{- end -}}
{{- end -}}
