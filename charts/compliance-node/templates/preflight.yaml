{{- /*
  Preflight. Renders nothing; aborts when an active rule is one the
  Compliance Operator would refuse to apply - because it does not apply
  to this cluster, or because a rule it depends on is switched off - or
  when two active rules would write the same file differently.
*/ -}}
{{- include "cr.applicabilityPreflight" . -}}
{{- include "cr.dependencyPreflight" . -}}
{{- $g0 := int (include "cr.countActive" (dict "root" . "rules" (list "rhcos4-disable_host_auth"))) -}}
{{- $g1 := int (include "cr.countActive" (dict "root" . "rules" (list "rhcos4-sshd_allow_only_protocol2" "rhcos4-sshd_disable_compression" "rhcos4-sshd_disable_empty_passwords" "rhcos4-sshd_disable_gssapi_auth" "rhcos4-sshd_disable_kerb_auth" "rhcos4-sshd_disable_pubkey_auth" "rhcos4-sshd_disable_rhosts" "rhcos4-sshd_disable_rhosts_rsa" "rhcos4-sshd_disable_root_login" "rhcos4-sshd_disable_root_password_login" "rhcos4-sshd_disable_tcp_forwarding" "rhcos4-sshd_disable_user_known_hosts" "rhcos4-sshd_disable_x11_forwarding" "rhcos4-sshd_do_not_permit_user_env" "rhcos4-sshd_enable_gssapi_auth" "rhcos4-sshd_enable_pam" "rhcos4-sshd_enable_pubkey_auth" "rhcos4-sshd_enable_strictmodes" "rhcos4-sshd_enable_warning_banner" "rhcos4-sshd_enable_warning_banner_net" "rhcos4-sshd_enable_x11_forwarding" "rhcos4-sshd_print_last_log" "rhcos4-sshd_set_idle_timeout" "rhcos4-sshd_set_keepalive" "rhcos4-sshd_set_login_grace_time" "rhcos4-sshd_set_loglevel_info" "rhcos4-sshd_set_loglevel_verbose" "rhcos4-sshd_set_max_auth_tries" "rhcos4-sshd_set_max_sessions" "rhcos4-sshd_set_maxstartups" "rhcos4-sshd_use_priv_separation"))) -}}
{{- if and (and (and (gt $g0 0) (gt $g1 0)) (semverCompare "<4.13.0" (printf "%s.%s.0" (.Values.cluster.ocpVersion | toString | splitList "." | first) (index (.Values.cluster.ocpVersion | toString | splitList ".") 1)))) (semverCompare "<=4.12" (printf "%s.%s.0" (.Values.cluster.ocpVersion | toString | splitList "." | first) (index (.Values.cluster.ocpVersion | toString | splitList ".") 1))) -}}
{{- fail "Conflicting compliance rules active: rhcos4-disable_host_auth / rhcos4-sshd_allow_only_protocol2, rhcos4-sshd_disable_compression, rhcos4-sshd_disable_empty_passwords, rhcos4-sshd_disable_gssapi_auth, rhcos4-sshd_disable_kerb_auth, rhcos4-sshd_disable_pubkey_auth, rhcos4-sshd_disable_rhosts, rhcos4-sshd_disable_rhosts_rsa, rhcos4-sshd_disable_root_login, rhcos4-sshd_disable_root_password_login, rhcos4-sshd_disable_tcp_forwarding, rhcos4-sshd_disable_user_known_hosts, rhcos4-sshd_disable_x11_forwarding, rhcos4-sshd_do_not_permit_user_env, rhcos4-sshd_enable_gssapi_auth, rhcos4-sshd_enable_pam, rhcos4-sshd_enable_pubkey_auth, rhcos4-sshd_enable_strictmodes, rhcos4-sshd_enable_warning_banner, rhcos4-sshd_enable_warning_banner_net, rhcos4-sshd_enable_x11_forwarding, rhcos4-sshd_print_last_log, rhcos4-sshd_set_idle_timeout, rhcos4-sshd_set_keepalive, rhcos4-sshd_set_login_grace_time, rhcos4-sshd_set_loglevel_info, rhcos4-sshd_set_loglevel_verbose, rhcos4-sshd_set_max_auth_tries, rhcos4-sshd_set_max_sessions, rhcos4-sshd_set_maxstartups, rhcos4-sshd_use_priv_separation write /etc/ssh/sshd_config with different content. They are separate objects, so nothing on the cluster would reject this - the MachineConfig Operator merges alphanumerically and the last one silently wins. Enable only one side." -}}
{{- end -}}
{{- $g0 := int (include "cr.countActive" (dict "root" . "rules" (list "rhcos4-sshd_enable_warning_banner"))) -}}
{{- $g1 := int (include "cr.countActive" (dict "root" . "rules" (list "rhcos4-sshd_enable_warning_banner_net"))) -}}
{{- if and (and (gt $g0 0) (gt $g1 0)) (semverCompare ">=4.13.0" (printf "%s.%s.0" (.Values.cluster.ocpVersion | toString | splitList "." | first) (index (.Values.cluster.ocpVersion | toString | splitList ".") 1))) -}}
{{- fail "Conflicting compliance rules active: rhcos4-sshd_enable_warning_banner / rhcos4-sshd_enable_warning_banner_net write /etc/ssh/sshd_config.d/00-complianceascode-Banner.conf with different content. They are separate objects, so nothing on the cluster would reject this - the MachineConfig Operator merges alphanumerically and the last one silently wins. Enable only one side." -}}
