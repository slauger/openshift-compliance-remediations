{{- define "cr.frag.machineconfig-75-ocp4-kernel-module-hfsplus-disabled.rhcos4-kernel-module-hfsplus-disabled.0" -}}
spec:
  config:
    ignition:
      version: 3.1.0
    storage:
      files:
      - contents:
          source: data:,install%20hfsplus%20/bin/false%0Ablacklist%20hfsplus%0A
        mode: 0644
        path: /etc/modprobe.d/hfsplus.conf
        overwrite: true
{{- end -}}

{{- /* MachineConfig/75-ocp4-kernel-module-hfsplus-disabled - rule(s): rhcos4-kernel_module_hfsplus_disabled */ -}}
{{- if and (.Values.node.enabled) (eq (include "cr.anyActive" (dict "root" . "rules" (list "rhcos4-kernel_module_hfsplus_disabled"))) "true") -}}
{{- $merged := dict -}}
{{- if eq (include "cr.ruleActive" (dict "root" . "rule" "rhcos4-kernel_module_hfsplus_disabled")) "true" -}}
{{- $frag := include "cr.frag.machineconfig-75-ocp4-kernel-module-hfsplus-disabled.rhcos4-kernel-module-hfsplus-disabled.0" . | fromYaml -}}
{{- $merged = mustMergeOverwrite $merged $frag -}}
{{- end -}}
{{- range $role := (.Values.node.roles | uniq) }}
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: {{ printf "%s-%s" "75-ocp4-kernel-module-hfsplus-disabled" $role }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
    compliance.openshift.io/managed: "true"
    machineconfiguration.openshift.io/role: {{ $role | quote }}
{{ $merged | toYaml }}
{{- end }}
{{- end -}}
