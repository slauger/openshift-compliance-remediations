{{- define "cr.frag.machineconfig-75-ocp4-service-vsftpd-disabled.rhcos4-service-vsftpd-disabled.0" -}}
spec:
  config:
    ignition:
      version: 3.1.0
    systemd:
      units:
      - name: vsftpd.service
        enabled: false
        mask: true
      - name: vsftpd.socket
        enabled: false
        mask: true
{{- end -}}

{{- /* MachineConfig/75-ocp4-service-vsftpd-disabled - rule(s): rhcos4-service_vsftpd_disabled */ -}}
{{- if and (.Values.node.enabled) (eq (include "cr.anyActive" (dict "root" . "rules" (list "rhcos4-service_vsftpd_disabled"))) "true") -}}
{{- $merged := dict -}}
{{- if eq (include "cr.ruleActive" (dict "root" . "rule" "rhcos4-service_vsftpd_disabled")) "true" -}}
{{- $frag := include "cr.frag.machineconfig-75-ocp4-service-vsftpd-disabled.rhcos4-service-vsftpd-disabled.0" . | fromYaml -}}
{{- $merged = mustMergeOverwrite $merged $frag -}}
{{- end -}}
{{- if not $merged -}}
{{- fail (printf "No remediation applies to MachineConfig/75-ocp4-service-vsftpd-disabled at cluster.ocpVersion %s. Every fix variant of the active rule(s) (rhcos4-service_vsftpd_disabled) is constrained to a different OpenShift version. Disable the rule(s) or set a supported cluster.ocpVersion." (.Values.cluster.ocpVersion | toString)) -}}
{{- end -}}
{{- range $role := (.Values.node.roles | uniq) }}
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: {{ printf "%s-%s" "75-ocp4-service-vsftpd-disabled" $role }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
    compliance.openshift.io/managed: "true"
    machineconfiguration.openshift.io/role: {{ $role | quote }}
{{ $merged | toYaml }}
{{- end }}
{{- end -}}
