{{- range $role := (.Values.node.roles | uniq) }}
{{- $selector := dict "spec" (dict "machineConfigPoolSelector" (dict "matchLabels" (dict (printf "pools.operator.machineconfiguration.openshift.io/%s" $role) ""))) -}}
{{- $obj := mustMergeOverwrite (deepCopy $merged) $selector }}
---
apiVersion: machineconfiguration.openshift.io/v1
kind: KubeletConfig
metadata:
  name: {{ printf "%s-%s" "compliance-operator-kubelet" $role }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
    compliance.openshift.io/managed: "true"
    machineconfiguration.openshift.io/role: {{ $role | quote }}
{{ $obj | toYaml }}
{{- end }}
{{- end -}}
