{{- define "cr.frag.kubeletconfig-compliance-kubelet-enable-iptables-util-chains.ocp4-kubelet-enable-iptables-util-chains.0" -}}
spec:
  kubeletConfig:
    makeIPTablesUtilChains: true
{{- end -}}

{{- /* KubeletConfig/compliance-kubelet-enable-iptables-util-chains - rule(s): ocp4-kubelet_enable_iptables_util_chains */ -}}
{{- if and (.Values.node.enabled) (eq (include "cr.anyActive" (dict "root" . "rules" (list "ocp4-kubelet_enable_iptables_util_chains"))) "true") -}}
{{- $merged := dict -}}
{{- if eq (include "cr.ruleActive" (dict "root" . "rule" "ocp4-kubelet_enable_iptables_util_chains")) "true" -}}
{{- $frag := include "cr.frag.kubeletconfig-compliance-kubelet-enable-iptables-util-chains.ocp4-kubelet-enable-iptables-util-chains.0" . | fromYaml -}}
{{- $merged = mustMergeOverwrite $merged $frag -}}
{{- end -}}
{{- if not $merged -}}
{{- fail (printf "No remediation applies to KubeletConfig/compliance-kubelet-enable-iptables-util-chains at cluster.ocpVersion %s. Every fix variant of the active rule(s) (ocp4-kubelet_enable_iptables_util_chains) is constrained to a different OpenShift version. Disable the rule(s) or set a supported cluster.ocpVersion." (.Values.cluster.ocpVersion | toString)) -}}
{{- end -}}
{{- range $role := (.Values.node.roles | uniq) }}
---
apiVersion: machineconfiguration.openshift.io/v1
kind: KubeletConfig
metadata:
  name: {{ printf "%s-%s" "compliance-kubelet-enable-iptables-util-chains" $role }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
    compliance.openshift.io/managed: "true"
    machineconfiguration.openshift.io/role: {{ $role | quote }}
{{ $merged | toYaml }}
{{- end }}
{{- end -}}
