{{- define "cr.frag.machineconfig-75-ocp4-disable-ctrlaltdel-reboot.rhcos4-disable-ctrlaltdel-reboot.0" -}}
spec:
  config:
    ignition:
      version: 3.1.0
    systemd:
      units:
      - name: ctrl-alt-del.target
        mask: true
{{- end -}}

{{- /* MachineConfig/75-ocp4-disable-ctrlaltdel-reboot - rule(s): rhcos4-disable_ctrlaltdel_reboot */ -}}
{{- if and (.Values.node.enabled) (eq (include "cr.anyActive" (dict "root" . "rules" (list "rhcos4-disable_ctrlaltdel_reboot"))) "true") -}}
{{- $merged := dict -}}
{{- if eq (include "cr.ruleActive" (dict "root" . "rule" "rhcos4-disable_ctrlaltdel_reboot")) "true" -}}
{{- $frag := include "cr.frag.machineconfig-75-ocp4-disable-ctrlaltdel-reboot.rhcos4-disable-ctrlaltdel-reboot.0" . | fromYaml -}}
{{- $merged = mustMergeOverwrite $merged $frag -}}
{{- end -}}
{{- range $role := (.Values.node.roles | uniq) }}
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: {{ printf "%s-%s" "75-ocp4-disable-ctrlaltdel-reboot" $role }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
    compliance.openshift.io/managed: "true"
    machineconfiguration.openshift.io/role: {{ $role | quote }}
{{ $merged | toYaml }}
{{- end }}
{{- end -}}
