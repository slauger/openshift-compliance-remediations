suite: applicability gate (architecture)
tests:
  # --- the gate refuses, and says which rules and why --------------------
  - it: refuses an aarch64 cluster when an inapplicable rule is active
    template: templates/preflight.yaml
    set:
      node:
        enabled: true
      cluster:
        architecture: aarch64
      rules:
        rhcos4-audit_rules_time_stime: true
    asserts:
      - failedTemplate:
          errorPattern: "rhcos4-audit_rules_time_stime - not applicable on aarch64"

  - it: refuses s390x for the same rule (both architectures are excluded)
    template: templates/preflight.yaml
    set:
      node:
        enabled: true
      cluster:
        architecture: s390x
      rules:
        rhcos4-audit_rules_time_stime: true
    asserts:
      - failedTemplate:
          errorPattern: "not applicable on s390x"

  - it: normalizes the Kubernetes architecture spelling
    # `oc get nodes` reports arm64, the compliance content says aarch64. If
    # these did not normalize, the gate would silently pass.
    template: templates/preflight.yaml
    set:
      node:
        enabled: true
      cluster:
        architecture: arm64
      rules:
        rhcos4-audit_rules_time_stime: true
    asserts:
      - failedTemplate:
          errorPattern: "not applicable on aarch64"

  - it: refuses a rule constrained only through its upstream group
    # usbguard_allow_hid_and_hub carries no <platform> of its own; the s390x
    # exclusion comes from content_group_usbguard. Parsing rule-level platforms
    # alone would miss it.
    template: templates/preflight.yaml
    set:
      node:
        enabled: true
      cluster:
        architecture: s390x
      rules:
        rhcos4-usbguard_allow_hid_and_hub: true
    asserts:
      - failedTemplate:
          errorPattern: "rhcos4-usbguard_allow_hid_and_hub - not applicable on s390x"

  - it: reports every offending rule in one message, not just the first
    template: templates/preflight.yaml
    set:
      node:
        enabled: true
      cluster:
        architecture: aarch64
      rules:
        rhcos4-audit_rules_time_stime: true
        rhcos4-audit_rules_dac_modification_chmod: true
    asserts:
      # helm-unittest matches against the error body, which drops the leading
      # count line - assert on both rule names instead.
      - failedTemplate:
          errorPattern: "rhcos4-audit_rules_dac_modification_chmod - not applicable"
      - failedTemplate:
          errorPattern: "rhcos4-audit_rules_time_stime - not applicable"

  - it: names the overlay that resolves it
    template: templates/preflight.yaml
    set:
      node:
        enabled: true
      cluster:
        architecture: aarch64
      rules:
        rhcos4-audit_rules_time_stime: true
    asserts:
      - failedTemplate:
          errorPattern: "values-aarch64.yaml"

  # --- and stays out of the way otherwise --------------------------------
  - it: passes on an architecture the rule applies to
    template: templates/preflight.yaml
    set:
      node:
        enabled: true
      cluster:
        architecture: ppc64le
      rules:
        rhcos4-audit_rules_time_stime: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the gated object on the default architecture
    template: templates/machineconfig-75-ocp4-audit-rules-time-stime.yaml
    set:
      node:
        enabled: true
        roles: [worker, master]
      rules:
        rhcos4-audit_rules_time_stime: true
    asserts:
      - hasDocuments:
          count: 2
      - exists:
          path: spec.config.storage.files

  - it: does not gate an unconstrained rule on aarch64
    # Guards against over-gating: only rules with an upstream constraint may be
    # refused.
    template: templates/kubeletconfig-compliance-operator-kubelet.yaml
    set:
      node:
        enabled: true
        roles: [worker, master]
      cluster:
        architecture: aarch64
      rules:
        ocp4-kubelet_configure_event_creation: true
    asserts:
      - hasDocuments:
          count: 2

  - it: ignores a constrained rule that is not active
    template: templates/preflight.yaml
    set:
      node:
        enabled: true
      cluster:
        architecture: aarch64
    asserts:
      - hasDocuments:
          count: 0

  # --- node-role restriction ---------------------------------------------
  - it: renders a master-only rule for the master pool only
    # The audit rules watch /var/log/{kube,oauth,openshift}-apiserver/, which
    # exist only where those control-plane components run.
    template: templates/machineconfig-75-ocp4-directory-access-var-log-kube-audit.yaml
    set:
      node:
        enabled: true
        roles: [worker, master]
      rules:
        ocp4-directory_access_var_log_kube_audit: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.labels["machineconfiguration.openshift.io/role"]
          value: master

  - it: renders nothing for a worker-only pool list
    template: templates/machineconfig-75-ocp4-directory-access-var-log-kube-audit.yaml
    set:
      node:
        enabled: true
        roles: [worker]
      rules:
        ocp4-directory_access_var_log_kube_audit: true
    asserts:
      - hasDocuments:
          count: 0

  - it: does not abort for a master-only rule, unlike an arch mismatch
    # With both roles listed the rule is legitimately wanted on one of them, so
    # skipping the other is right and failing would be wrong.
    template: templates/preflight.yaml
    set:
      node:
        enabled: true
        roles: [worker]
      rules:
        ocp4-directory_access_var_log_kube_audit: true
    asserts:
      - hasDocuments:
          count: 0

  - it: still renders an unrestricted node rule for every role
    template: templates/kubeletconfig-compliance-operator-kubelet.yaml
    set:
      node:
        enabled: true
        roles: [worker, master]
      rules:
        ocp4-kubelet_configure_event_creation: true
    asserts:
      - hasDocuments:
          count: 2

  # --- KubeletConfig consolidation ---------------------------------------
  - it: merges every active kubelet rule into one object per pool
    template: templates/kubeletconfig-compliance-operator-kubelet.yaml
    set:
      node:
        enabled: true
        roles: [worker, master]
      rules:
        ocp4-kubelet_configure_event_creation: true
        ocp4-kubelet_configure_tls_min_version: true
    asserts:
      - hasDocuments:
          count: 2
      - exists:
          path: spec.kubeletConfig.eventRecordQPS
      - exists:
          path: spec.kubeletConfig.tlsMinVersion

  - it: gives each pool its own selector
    template: templates/kubeletconfig-compliance-operator-kubelet.yaml
    documentIndex: 1
    set:
      node:
        enabled: true
        roles: [worker, master]
      rules:
        ocp4-kubelet_configure_event_creation: true
    asserts:
      - equal:
          path: metadata.name
          value: compliance-operator-kubelet-master
      - equal:
          path: spec.machineConfigPoolSelector.matchLabels["pools.operator.machineconfiguration.openshift.io/master"]
          value: ""
      - notExists:
          path: spec.machineConfigPoolSelector.matchLabels["pools.operator.machineconfiguration.openshift.io/worker"]

  # --- consolidated chrony object ----------------------------------------
  - it: still emits one chrony MachineConfig per pool, not one in total
    # Consolidation is across rules, not across pools: the role loop is
    # untouched, so each MachineConfigPool keeps its own object and label.
    template: templates/machineconfig-75-ocp4-chrony.yaml
    set:
      node:
        enabled: true
        roles: [worker, master]
      rules:
        rhcos4-chronyd_client_only: true
        rhcos4-chronyd_or_ntpd_set_maxpoll: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: 75-ocp4-chrony-worker
        documentIndex: 0
      - equal:
          path: metadata.labels["machineconfiguration.openshift.io/role"]
          value: master
        documentIndex: 1

  - it: renders the full chrony configuration from a single rule
    # Each upstream fix ships the whole file, so one rule is enough - that is
    # what makes consolidating them sound.
    template: templates/machineconfig-75-ocp4-chrony.yaml
    documentIndex: 0
    set:
      node:
        enabled: true
        roles: [worker]
      rules:
        rhcos4-chronyd_client_only: true
    asserts:
      - hasDocuments:
          count: 1
      - lengthEqual:
          path: spec.config.storage.files
          count: 3

  # --- rule dependencies --------------------------------------------------
  - it: refuses a rule whose upstream dependency was switched off
    template: templates/preflight.yaml
    set:
      node:
        enabled: true
      profiles:
        rhcos4-stig: true
      rules:
        rhcos4-package_usbguard_installed: false
    asserts:
      - failedTemplate:
          errorPattern: "rhcos4-usbguard_allow_hid_and_hub requires rhcos4-package_usbguard_installed, which is not active"

  - it: does not fire in the other direction
    # The dependency applied without the rule that needs it is fine, and the
    # operator would not complain either. Failing here would be wrong.
    template: templates/preflight.yaml
    set:
      node:
        enabled: true
      profiles:
        rhcos4-stig: true
      rules:
        rhcos4-usbguard_allow_hid_and_hub: false
        rhcos4-service_usbguard_enabled: false
        rhcos4-configure_usbguard_auditbackend: false
    asserts:
      - hasDocuments:
          count: 0

  - it: stays quiet when a profile enables both sides
    template: templates/preflight.yaml
    set:
      node:
        enabled: true
      profiles:
        rhcos4-stig: true
    asserts:
      - hasDocuments:
          count: 0

  # --- cross-object file conflicts ---------------------------------------
  - it: refuses two rules that write the same sshd drop-in differently
    # Separate objects, so no per-object check sees this. The MCO would merge
    # alphanumerically and silently take X11Forwarding yes.
    template: templates/preflight.yaml
    set:
      node:
        enabled: true
      rules:
        rhcos4-sshd_disable_x11_forwarding: true
        rhcos4-sshd_enable_x11_forwarding: true
    asserts:
      - failedTemplate:
          errorPattern: "00-complianceascode-X11Forwarding.conf with different content"

  - it: allows one side of the pair
    template: templates/preflight.yaml
    set:
      node:
        enabled: true
      rules:
        rhcos4-sshd_disable_x11_forwarding: true
    asserts:
      - hasDocuments:
          count: 0

  - it: does not fire for the whole-file variants above 4.13
    # Below 4.13 the sshd rules write all of sshd_config and disable_host_auth
    # differs from the rest; from 4.13 they use drop-ins and never meet.
    template: templates/preflight.yaml
    set:
      node:
        enabled: true
      cluster:
        ocpVersion: "4.18"
      rules:
        rhcos4-disable_host_auth: true
        rhcos4-sshd_disable_rhosts: true
    asserts:
      - hasDocuments:
          count: 0

  - it: fires for them below 4.13
    template: templates/preflight.yaml
    set:
      node:
        enabled: true
      cluster:
        ocpVersion: "4.12"
      rules:
        rhcos4-disable_host_auth: true
        rhcos4-sshd_disable_rhosts: true
    asserts:
      - failedTemplate:
          errorPattern: "/etc/ssh/sshd_config with different content"

  # --- regressions found by review ---------------------------------------
  - it: renders one TailoredProfile per enabled profile, not glued together
    # A right-trim on the line before `---` swallowed the newline, so any two
    # enabled profiles of a layer produced invalid YAML. One profile worked,
    # which is why lint and the per-profile cases never saw it.
    template: templates/tailoredprofile.yaml
    set:
      node:
        enabled: true
      tailoredProfile:
        enabled: true
      profiles:
        rhcos4-stig: true
        rhcos4-e8: true
    asserts:
      - hasDocuments:
          count: 2

  - it: gives the TailoredProfile an RFC1123 name
    # Profile ids carry underscores; a Kubernetes object name may not, and
    # `extends` has to match the operator's dash-spelled Profile CR.
    template: templates/tailoredprofile.yaml
    set:
      node:
        enabled: true
      tailoredProfile:
        enabled: true
      profiles:
        rhcos4-anssi_bp28_high: true
    asserts:
      - equal:
          path: metadata.name
          value: hardening-rhcos4-anssi-bp28-high
      - equal:
          path: spec.extends
          value: rhcos4-anssi-bp28-high
