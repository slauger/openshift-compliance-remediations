suite: node activation and per-role emission
tests:
  - it: renders nothing when node.enabled is false (default), even with rule set
    template: templates/kubeletconfig-compliance-operator-kubelet.yaml
    set:
      rules:
        ocp4-kubelet_configure_event_creation: true
    asserts:
      - hasDocuments:
          count: 0

  - it: emits one object per node role when enabled
    template: templates/kubeletconfig-compliance-operator-kubelet.yaml
    set:
      node:
        enabled: true
        roles: [worker, master]
      rules:
        ocp4-kubelet_configure_event_creation: true
    asserts:
      - hasDocuments:
          count: 2

  - it: synthesizes per-role names and sets the MCP role label
    template: templates/kubeletconfig-compliance-operator-kubelet.yaml
    documentIndex: 0
    set:
      node:
        enabled: true
        roles: [worker]
      rules:
        ocp4-kubelet_configure_event_creation: true
    asserts:
      - equal:
          path: metadata.name
          value: compliance-operator-kubelet-worker
      - equal:
          path: metadata.labels["machineconfiguration.openshift.io/role"]
          value: worker
      # A KubeletConfig without this selector matches no pool at all and the
      # object does nothing. The label is the one the MCO puts on its built-in
      # pools, and the one the operator sets.
      - equal:
          path: spec.machineConfigPoolSelector.matchLabels["pools.operator.machineconfiguration.openshift.io/worker"]
          value: ""

  - it: resolves the kubelet event-record-qps variable default
    template: templates/kubeletconfig-compliance-operator-kubelet.yaml
    documentIndex: 0
    set:
      node:
        enabled: true
        roles: [worker]
      rules:
        ocp4-kubelet_configure_event_creation: true
    asserts:
      - equal:
          path: spec.kubeletConfig.eventRecordQPS
          value: 50

  - it: labels the object for ownership queries
    # Our object names collide with the operator-generated ones on purpose, so
    # part-of is the only way to tell from the cluster what this chart owns.
    # Nothing pinned any of these labels before, which is how the TailoredProfile
    # came to be the one object missing the set.
    template: templates/kubeletconfig-compliance-operator-kubelet.yaml
    documentIndex: 0
    release:
      name: hardening
    set:
      node:
        enabled: true
        roles: [worker]
      rules:
        ocp4-kubelet_configure_event_creation: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: compliance-hardening
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: compliance-node
      # The documented mixed-architecture pattern installs the node chart twice
      # with different node.roles; instance is what tells the two apart.
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: hardening
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: remediation
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      # Still the functional one: without it the object belongs to no pool.
      - equal:
          path: metadata.labels["machineconfiguration.openshift.io/role"]
          value: worker
      - notExists:
          path: metadata.labels["compliance.openshift.io/managed"]

  - it: does not protect node objects from a helm uninstall
    # The mirror image of the platform chart: a MachineConfig is ours, so
    # uninstalling must delete it and roll the hardening back. A keep policy
    # here would leave the pools hardened with no way to undo it via Helm.
    template: templates/kubeletconfig-compliance-operator-kubelet.yaml
    documentIndex: 0
    set:
      node:
        enabled: true
        roles: [worker]
      rules:
        ocp4-kubelet_configure_event_creation: true
    asserts:
      - notExists:
          path: metadata.annotations["helm.sh/resource-policy"]

  - it: renders an object the user added, with the chart's labels
    # extraManifests is the one place for content upstream has no remediation
    # for - rhcos4-sshd_limit_user_access being the case that prompted it.
    # component: local marks it as not upstream-derived.
    template: templates/extra-manifests.yaml
    release:
      name: hardening
    set:
      node:
        enabled: true
      extraManifests:
        sshd-allow-users:
          apiVersion: machineconfiguration.openshift.io/v1
          kind: MachineConfig
          metadata:
            name: 75-local-sshd-allow-users
            labels:
              machineconfiguration.openshift.io/role: worker
          spec:
            config:
              ignition:
                version: 3.1.0
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: 75-local-sshd-allow-users
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: compliance-hardening
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: local
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: hardening
      # The user's own labels survive next to ours.
      - equal:
          path: metadata.labels["machineconfiguration.openshift.io/role"]
          value: worker
      # `enabled` is a control field, not part of the object.
      - notExists:
          path: enabled

  - it: lets an overlay switch one entry off without restating it
    # A map, not a list, precisely for this: Helm replaces lists and merges
    # maps, so with a list an overlay would have to repeat every other entry.
    template: templates/extra-manifests.yaml
    set:
      node:
        enabled: true
      extraManifests:
        sshd-allow-users:
          enabled: false
          apiVersion: machineconfiguration.openshift.io/v1
          kind: MachineConfig
          metadata:
            name: 75-local-sshd-allow-users
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing by default
    template: templates/extra-manifests.yaml
    set:
      node:
        enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses an entry without a kind instead of emitting a headless object
    template: templates/extra-manifests.yaml
    set:
      node:
        enabled: true
      extraManifests:
        broken:
          apiVersion: v1
          metadata:
            name: x
    asserts:
      - failedTemplate:
          errorPattern: "extraManifests.broken has no kind"
