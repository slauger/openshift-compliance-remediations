suite: node activation and per-role emission
tests:
  - it: renders nothing when node.enabled is false (default), even with rule set
    template: templates/kubeletconfig-compliance-operator-kubelet.yaml
    set:
      rules:
        ocp4-kubelet_configure_event_creation: true
    asserts:
      - hasDocuments:
          count: 0

  - it: emits one object per node role when enabled
    template: templates/kubeletconfig-compliance-operator-kubelet.yaml
    set:
      node:
        enabled: true
        roles: [worker, master]
      rules:
        ocp4-kubelet_configure_event_creation: true
    asserts:
      - hasDocuments:
          count: 2

  - it: synthesizes per-role names and sets the MCP role label
    template: templates/kubeletconfig-compliance-operator-kubelet.yaml
    documentIndex: 0
    set:
      node:
        enabled: true
        roles: [worker]
      rules:
        ocp4-kubelet_configure_event_creation: true
    asserts:
      - equal:
          path: metadata.name
          value: compliance-operator-kubelet-worker
      - equal:
          path: metadata.labels["machineconfiguration.openshift.io/role"]
          value: worker
      # A KubeletConfig without this selector matches no pool at all and the
      # object does nothing. The label is the one the MCO puts on its built-in
      # pools, and the one the operator sets.
      - equal:
          path: spec.machineConfigPoolSelector.matchLabels["pools.operator.machineconfiguration.openshift.io/worker"]
          value: ""

  - it: resolves the kubelet event-record-qps variable default
    template: templates/kubeletconfig-compliance-operator-kubelet.yaml
    documentIndex: 0
    set:
      node:
        enabled: true
        roles: [worker]
      rules:
        ocp4-kubelet_configure_event_creation: true
    asserts:
      - equal:
          path: spec.kubeletConfig.eventRecordQPS
          value: 50

  - it: labels the object for ownership queries
    # Our object names collide with the operator-generated ones on purpose, so
    # part-of is the only way to tell from the cluster what this chart owns.
    # Nothing pinned any of these labels before, which is how the TailoredProfile
    # came to be the one object missing the set.
    template: templates/kubeletconfig-compliance-operator-kubelet.yaml
    documentIndex: 0
    release:
      name: hardening
    set:
      node:
        enabled: true
        roles: [worker]
      rules:
        ocp4-kubelet_configure_event_creation: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: compliance-hardening
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: compliance-node
      # The documented mixed-architecture pattern installs the node chart twice
      # with different node.roles; instance is what tells the two apart.
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: hardening
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: remediation
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      # Still the functional one: without it the object belongs to no pool.
      - equal:
          path: metadata.labels["machineconfiguration.openshift.io/role"]
          value: worker
      - notExists:
          path: metadata.labels["compliance.openshift.io/managed"]

  - it: does not protect node objects from a helm uninstall
    # The mirror image of the platform chart: a MachineConfig is ours, so
    # uninstalling must delete it and roll the hardening back. A keep policy
    # here would leave the pools hardened with no way to undo it via Helm.
    template: templates/kubeletconfig-compliance-operator-kubelet.yaml
    documentIndex: 0
    set:
      node:
        enabled: true
        roles: [worker]
      rules:
        ocp4-kubelet_configure_event_creation: true
    asserts:
      - notExists:
          path: metadata.annotations["helm.sh/resource-policy"]
