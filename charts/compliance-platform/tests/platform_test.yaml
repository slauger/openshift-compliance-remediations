suite: platform activation logic
templates:
  - templates/apiserver-cluster.yaml
  - templates/oauth-cluster.yaml
  - templates/openshift-ingress-operator-ingresscontroller-default.yaml
  - templates/openshift-kube-apiserver-prometheusrule-audit-errors.yaml
tests:
  - it: renders nothing with all profiles off (defaults)
    template: templates/apiserver-cluster.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: activates a single rule without any profile
    template: templates/apiserver-cluster.yaml
    set:
      rules:
        ocp4-audit_profile_set: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: APIServer

  - it: blacklist wins over profile (audit disabled)
    template: templates/apiserver-cluster.yaml
    set:
      rules:
        ocp4-audit_profile_set: true
        ocp4-api_server_encryption_provider_cipher: false
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: spec.encryption

  - it: selects aesgcm on OCP 4.20
    template: templates/apiserver-cluster.yaml
    set:
      cluster:
        ocpVersion: "4.20"
      rules:
        ocp4-api_server_encryption_provider_cipher: true
    asserts:
      - equal:
          path: spec.encryption.type
          value: aesgcm

  - it: selects aescbc on OCP 4.12
    template: templates/apiserver-cluster.yaml
    set:
      cluster:
        ocpVersion: "4.12"
      rules:
        ocp4-api_server_encryption_provider_cipher: true
    asserts:
      - equal:
          path: spec.encryption.type
          value: aescbc

  - it: accepts a full X.Y.Z cluster.ocpVersion without crashing
    template: templates/apiserver-cluster.yaml
    set:
      cluster:
        ocpVersion: "4.20.1"
      rules:
        ocp4-api_server_encryption_provider_cipher: true
    asserts:
      - equal:
          path: spec.encryption.type
          value: aesgcm

  - it: fails when two mutually-exclusive TLS rules are active
    template: templates/apiserver-cluster.yaml
    set:
      rules:
        ocp4-api_server_tls_security_profile_custom_min_tls_version: true
        ocp4-api_server_tls_security_profile_not_old: true
    asserts:
      - failedTemplate:
          errorMessage: "Conflicting compliance rules active for APIServer/cluster at spec.tlsSecurityProfile: ocp4-api_server_tls_security_profile_custom_min_tls_version, ocp4-api_server_tls_security_profile_not_old. These are mutually-exclusive alternatives - enable only one."

  - it: renders IngressController TLS hardening for ocp4-cis out of the box
    template: templates/openshift-ingress-operator-ingresscontroller-default.yaml
    set:
      profiles:
        ocp4-cis: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: IngressController

  - it: labels the object for ownership queries
    template: templates/apiserver-cluster.yaml
    documentIndex: 0
    release:
      name: hardening
    set:
      rules:
        ocp4-audit_profile_set: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: compliance-hardening
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: compliance-platform
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: hardening
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: remediation
      # Platform objects are cluster singletons, so no role label here.
      - notExists:
          path: metadata.labels["machineconfiguration.openshift.io/role"]
      - notExists:
          path: metadata.labels["compliance.openshift.io/managed"]

  - it: protects pre-existing cluster objects from a helm uninstall
    # APIServer/cluster, OAuth/cluster, Project/cluster, IngressController/default
    # and PrometheusRule/audit-errors all exist on a stock cluster and belong to
    # a cluster operator. Without this annotation, removing the release deletes
    # cluster configuration - and IngressController/default takes the router
    # with it.
    template: templates/apiserver-cluster.yaml
    documentIndex: 0
    set:
      rules:
        ocp4-audit_profile_set: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: does not ship the already-satisfied audit alert by default
    # A stock cluster ships this alert, and cluster-kube-apiserver-operator owns
    # .spec.groups[apiserver-audit].rules: server-side apply refuses the change
    # and client-side apply loses to the operator. Upstream's copy also drops
    # the alert's namespace label. The operator would never apply it either -
    # it remediates only what fails, and this check passes.
    template: templates/openshift-kube-apiserver-prometheusrule-audit-errors.yaml
    set:
      profiles:
        ocp4-moderate: true
    asserts:
      - hasDocuments:
          count: 0

  - it: still ships it on an explicit opt-in
    template: templates/openshift-kube-apiserver-prometheusrule-audit-errors.yaml
    set:
      profiles:
        ocp4-moderate: true
      rules:
        ocp4-audit_error_alert_exists: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: PrometheusRule
