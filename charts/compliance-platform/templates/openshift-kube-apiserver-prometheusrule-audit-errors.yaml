{{- define "cr.frag.openshift-kube-apiserver-prometheusrule-audit-errors.ocp4-audit-error-alert-exists.0" -}}
spec:
  groups:
  - name: apiserver-audit
    rules:
    - alert: AuditLogError
      annotations:
        summary: |-
          An API Server instance was unable to write audit logs. This could be
          triggered by the node running out of space, or a malicious actor
          tampering with the audit logs.
        description: An API Server had an error writing to an audit log.
      expr: |
        sum by (apiserver,instance)(rate(apiserver_audit_error_total{apiserver=~".+-apiserver"}[5m])) / sum by (apiserver,instance) (rate(apiserver_audit_event_total{apiserver=~".+-apiserver"}[5m])) > 0
      for: 1m
      labels:
        severity: warning
{{- end -}}

{{- /* PrometheusRule/audit-errors - rule(s): ocp4-audit_error_alert_exists */ -}}
{{- if eq (include "cr.anyActive" (dict "root" . "rules" (list "ocp4-audit_error_alert_exists"))) "true" -}}
{{- $merged := dict -}}
{{- $fileAcc := dict -}}
{{- if eq (include "cr.ruleActive" (dict "root" . "rule" "ocp4-audit_error_alert_exists")) "true" -}}
{{- $frag := include "cr.frag.openshift-kube-apiserver-prometheusrule-audit-errors.ocp4-audit-error-alert-exists.0" . | fromYaml -}}
{{- if hasKey $frag "Error" -}}
{{- fail (printf "Rendering ocp4-audit_error_alert_exists for PrometheusRule/audit-errors produced invalid YAML: %s. Check the variables it interpolates." $frag.Error) -}}
{{- end -}}
{{- range $f := (dig "spec" "config" "storage" "files" (list) $frag) -}}
{{- $prev := index $fileAcc ($f.path | toString) -}}
{{- if and $prev (ne (toJson $prev) (toJson $f)) -}}
{{- fail (printf "Conflicting content for %s in PrometheusRule/audit-errors: ocp4-audit_error_alert_exists writes it differently than another active rule does. Both cannot apply - enable only one, or pick the variant that matches your cluster.ocpVersion." $f.path) -}}
{{- end -}}
{{- $_ := set $fileAcc ($f.path | toString) $f -}}
{{- end -}}
{{- $merged = mustMergeOverwrite $merged $frag -}}
{{- end -}}
{{- if $fileAcc -}}
{{- $files := list -}}
{{- range $p := (keys $fileAcc | sortAlpha) -}}
{{- $files = append $files (index $fileAcc $p) -}}
{{- end -}}
{{- $merged = mustMergeOverwrite $merged (dict "spec" (dict "config" (dict "storage" (dict "files" $files)))) -}}
{{- end -}}
{{- if not $merged -}}
{{- fail (printf "No remediation applies to PrometheusRule/audit-errors at cluster.ocpVersion %s. Every fix variant of the active rule(s) (ocp4-audit_error_alert_exists) is constrained to a different OpenShift version. Disable the rule(s) or set a supported cluster.ocpVersion." (.Values.cluster.ocpVersion | toString)) -}}
{{- end -}}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: audit-errors
  namespace: openshift-kube-apiserver
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | trunc 63 | trimSuffix "-" | quote }}
    app.kubernetes.io/component: remediation
    app.kubernetes.io/part-of: compliance-hardening
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
{{ $merged | toYaml }}
{{- end -}}
