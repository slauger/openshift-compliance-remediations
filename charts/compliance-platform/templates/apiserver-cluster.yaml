{{- define "cr.frag.apiserver-cluster.ocp4-api-server-encryption-provider-cipher.0" -}}
spec:
  encryption:
    type: "aescbc"
{{- end -}}

{{- define "cr.frag.apiserver-cluster.ocp4-api-server-encryption-provider-cipher.1" -}}
spec:
  encryption:
    type: "aesgcm"
{{- end -}}

{{- define "cr.frag.apiserver-cluster.ocp4-api-server-tls-security-profile-custom-min-tls-version.2" -}}
spec:
    tlsSecurityProfile:
        Custom:
            minTLSVersion: VersionTLS12
{{- end -}}

{{- define "cr.frag.apiserver-cluster.ocp4-api-server-tls-security-profile-not-old.3" -}}
spec:
    tlsSecurityProfile:
        intermediate: {}
        type: Intermediate
{{- end -}}

{{- define "cr.frag.apiserver-cluster.ocp4-audit-profile-set.4" -}}
spec:
  audit:
    profile: {{ .Values.variables.var_openshift_audit_profile }}
{{- end -}}

{{- /* APIServer/cluster - rule(s): ocp4-api_server_encryption_provider_cipher, ocp4-api_server_tls_security_profile_custom_min_tls_version, ocp4-api_server_tls_security_profile_not_old, ocp4-audit_profile_set */ -}}
{{- if eq (include "cr.anyActive" (dict "root" . "rules" (list "ocp4-api_server_encryption_provider_cipher" "ocp4-api_server_tls_security_profile_custom_min_tls_version" "ocp4-api_server_tls_security_profile_not_old" "ocp4-audit_profile_set"))) "true" -}}
{{- if gt (int (include "cr.countActive" (dict "root" . "rules" (list "ocp4-api_server_tls_security_profile_custom_min_tls_version" "ocp4-api_server_tls_security_profile_not_old")))) 1 -}}
{{- fail "Conflicting compliance rules active for APIServer/cluster at spec.tlsSecurityProfile: ocp4-api_server_tls_security_profile_custom_min_tls_version, ocp4-api_server_tls_security_profile_not_old. These are mutually-exclusive alternatives - enable only one." -}}
{{- end -}}
{{- $merged := dict -}}
{{- if and (eq (include "cr.ruleActive" (dict "root" . "rule" "ocp4-api_server_encryption_provider_cipher")) "true") (semverCompare "<4.13.0" (printf "%s.%s.0" (.Values.targetOCPVersion | toString | splitList "." | first) (index (.Values.targetOCPVersion | toString | splitList ".") 1))) -}}
{{- $frag := include "cr.frag.apiserver-cluster.ocp4-api-server-encryption-provider-cipher.0" . | fromYaml -}}
{{- $merged = mustMergeOverwrite $merged $frag -}}
{{- end -}}
{{- if and (eq (include "cr.ruleActive" (dict "root" . "rule" "ocp4-api_server_encryption_provider_cipher")) "true") (semverCompare ">=4.13.0" (printf "%s.%s.0" (.Values.targetOCPVersion | toString | splitList "." | first) (index (.Values.targetOCPVersion | toString | splitList ".") 1))) -}}
{{- $frag := include "cr.frag.apiserver-cluster.ocp4-api-server-encryption-provider-cipher.1" . | fromYaml -}}
{{- $merged = mustMergeOverwrite $merged $frag -}}
{{- end -}}
{{- if eq (include "cr.ruleActive" (dict "root" . "rule" "ocp4-api_server_tls_security_profile_custom_min_tls_version")) "true" -}}
{{- $frag := include "cr.frag.apiserver-cluster.ocp4-api-server-tls-security-profile-custom-min-tls-version.2" . | fromYaml -}}
{{- $merged = mustMergeOverwrite $merged $frag -}}
{{- end -}}
{{- if eq (include "cr.ruleActive" (dict "root" . "rule" "ocp4-api_server_tls_security_profile_not_old")) "true" -}}
{{- $frag := include "cr.frag.apiserver-cluster.ocp4-api-server-tls-security-profile-not-old.3" . | fromYaml -}}
{{- $merged = mustMergeOverwrite $merged $frag -}}
{{- end -}}
{{- if eq (include "cr.ruleActive" (dict "root" . "rule" "ocp4-audit_profile_set")) "true" -}}
{{- $frag := include "cr.frag.apiserver-cluster.ocp4-audit-profile-set.4" . | fromYaml -}}
{{- $merged = mustMergeOverwrite $merged $frag -}}
{{- end -}}
---
apiVersion: config.openshift.io/v1
kind: APIServer
metadata:
  name: cluster
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    compliance.openshift.io/managed: "true"
{{ $merged | toYaml }}
{{- end -}}
