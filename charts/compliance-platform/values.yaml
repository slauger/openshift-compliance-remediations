# Values for the compliance-platform chart.
# Generated from ComplianceAsCode/content v0.1.82.

# -- Target OpenShift version; selects version-dependent remediations.
# Find yours: oc get clusterversion version -o jsonpath='{.status.desired.version}'
targetOCPVersion: "4.20"

# -- Whitelist whole compliance profiles (product-namespaced, e.g. ocp4-cis).
profiles:
  ocp4-bsi: false
  ocp4-bsi-2022: false
  ocp4-cis: false
  ocp4-cis-1-7: false
  ocp4-cis-1-9: false
  ocp4-e8: false
  ocp4-high: false
  ocp4-high-rev-4: false
  ocp4-moderate: false
  ocp4-moderate-rev-4: false
  ocp4-nerc-cip: false
  ocp4-pci-dss: false
  ocp4-pci-dss-3-2: false
  ocp4-pci-dss-4-0: false
  ocp4-stig: false
  ocp4-stig-v2r2: false
  ocp4-stig-v2r3: false

# -- Per-rule override / blacklist. Explicit value wins over profiles.
# Key is the product-namespaced rule name, e.g. ocp4-audit_profile_set: false
# Pre-populated below: for each group of mutually-exclusive alternatives the
# losers are disabled so whitelisting a whole profile renders out of the box.
# Flip these to choose a different alternative.
rules:
  ocp4-api_server_tls_security_profile_custom_min_tls_version: false  # alternative of ocp4-api_server_tls_security_profile_not_old on APIServer/cluster
  ocp4-ingress_controller_tls_security_profile_custom_min_tls_version: false  # alternative of ocp4-ingress_controller_tls_cipher_suites on IngressController/default
  ocp4-ingress_controller_tls_security_profile_not_old: false  # alternative of ocp4-ingress_controller_tls_cipher_suites on IngressController/default

# -- Optionally render a matching TailoredProfile per enabled profile so the
# Compliance Operator scans exactly this selection.
tailoredProfile:
  enabled: false

# -- Namespace the Compliance Operator watches for TailoredProfiles.
complianceNamespace: openshift-compliance

# -- Tunable XCCDF variables (pre-filled with upstream defaults).
variables:
  var_event_record_qps: "50"
  var_kubelet_evictionhard_imagefs_available: "15%"
  var_kubelet_evictionhard_imagefs_inodesfree: "5%"
  var_kubelet_evictionhard_memory_available: 100Mi
  var_kubelet_evictionhard_nodefs_available: "10%"
  var_kubelet_evictionhard_nodefs_inodesfree: "5%"
  var_kubelet_evictionsoft_imagefs_available: "20%"
  var_kubelet_evictionsoft_imagefs_inodesfree: "15%"
  var_kubelet_evictionsoft_memory_available: 500Mi
  var_kubelet_evictionsoft_nodefs_available: "15%"
  var_kubelet_evictionsoft_nodefs_inodesfree: "10%"
  var_kubelet_tls_cipher_suites: "TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256"
  var_kubelet_tls_min_version: VersionTLS12
  var_oauth_inactivity_timeout: 10m0s
  var_oauth_token_maxage: "28800"
  var_openshift_audit_profile: WriteRequestBodies
  var_streaming_connection_timeouts: 4h0m0s
  var_system_crypto_policy: FIPS

