name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install generator + dev deps
        run: pip install -e '.[dev]'

      - name: Ruff
        run: ruff check src tests

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Install helm-unittest plugin
        env:
          # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
          HELM_UNITTEST_VERSION: v1.2.1
        run: |
          # Helm 4 verifies plugin signatures by default and refuses VCS
          # sources outright. helm-unittest does publish a signed release
          # tarball, but it bundles every platform binary (~170 MB) and
          # verifying it needs the maintainer's key in a local keyring - too
          # much machinery for a test-only plugin. Pin the version instead, so
          # the install is at least reproducible and Renovate-tracked.
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version "$HELM_UNITTEST_VERSION" --verify=false

      - name: Install helm-docs
        env:
          # renovate: datasource=github-releases depName=norwoodj/helm-docs
          HELM_DOCS_VERSION: v1.14.2
        run: |
          curl -sSLo /tmp/helm-docs.tar.gz \
            "https://github.com/norwoodj/helm-docs/releases/download/${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION#v}_Linux_x86_64.tar.gz"
          sudo tar -xzf /tmp/helm-docs.tar.gz -C /usr/local/bin helm-docs

      - name: Cache upstream content tarball
        uses: actions/cache@v6
        with:
          path: .cache
          key: sscg-${{ hashFiles('config/content.yaml') }}

      - name: Generate charts
        run: |
          make generate
          make docs
          # Fail if generation changed anything under charts/ or RULES.md.
          # `git diff` ignores untracked paths, so a file the generator newly
          # ADDS - an overlay for a new architecture, an object for a new rule -
          # would pass as "no drift". Compare the porcelain status instead.
          drift="$(git status --porcelain -- charts/ RULES.md)"
          if [ -n "$drift" ]; then
            echo "::error::Generated charts/RULES.md are out of date. Run 'make generate' and commit.";
            echo "$drift";
            exit 1;
          fi

      - name: Helm lint
        run: make lint

      - name: Helm unittest
        run: make test

      - name: Install ignition-validate
        env:
          # renovate: datasource=github-releases depName=coreos/ignition
          IGNITION_VERSION: v2.27.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ignition-validate" \
            "https://github.com/coreos/ignition/releases/download/$IGNITION_VERSION/ignition-validate-x86_64-linux"
          sudo install -m 0755 "$RUNNER_TEMP/ignition-validate" /usr/local/bin/ignition-validate
          ignition-validate --version

      # ausyscall resolves the syscall names in the generated audit rules
      # against this architecture's table. Read-only, unlike `auditctl -R`,
      # which is why it is not in OPTIONAL_CHECKS: with REQUIRE_TOOLS=1 a
      # missing tool is a failure, so this check cannot quietly stop running.
      # It exists because augenrules aborts at the first rule it cannot load -
      # a single dead syscall name dropped 42 rules and the immutable flag on a
      # live node while every offline check passed.
      - name: Install audit tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq auditd
          ausyscall --dump | head -1

      - name: Python unit tests
        run: make test-py

      - name: Validate rendered payloads
        env:
          # The tools are installed above, so a skipped check means the install
          # broke - not that the check is optional.
          REQUIRE_TOOLS: "1"
        run: make validate-payloads
