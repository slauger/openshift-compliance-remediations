name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install generator + dev deps
        run: pip install -e '.[dev]'

      - name: Ruff
        run: ruff check src tests

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.0

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest

      - name: Cache upstream content tarball
        uses: actions/cache@v4
        with:
          path: .cache
          key: sscg-${{ hashFiles('config/content.yaml') }}

      - name: Generate charts
        run: |
          make generate
          # Fail if generation produced an uncommitted diff (charts drifted).
          git diff --exit-code charts/ RULES.md || {
            echo "::error::Generated charts/RULES.md are out of date. Run 'make generate' and commit.";
            exit 1;
          }

      - name: Helm lint
        run: make lint

      - name: Helm unittest
        run: make test

      - name: Python unit tests
        run: make test-py
