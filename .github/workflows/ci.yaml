name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install generator + dev deps
        run: pip install -e '.[dev]'

      - name: Ruff
        run: ruff check src tests

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Install helm-unittest plugin
        env:
          # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
          HELM_UNITTEST_VERSION: v1.1.2
        run: |
          # Helm 4 verifies plugin signatures by default and refuses VCS
          # sources outright. helm-unittest does publish a signed release
          # tarball, but it bundles every platform binary (~170 MB) and
          # verifying it needs the maintainer's key in a local keyring - too
          # much machinery for a test-only plugin. Pin the version instead, so
          # the install is at least reproducible and Renovate-tracked.
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version "$HELM_UNITTEST_VERSION" --verify=false

      - name: Cache upstream content tarball
        uses: actions/cache@v6
        with:
          path: .cache
          key: sscg-${{ hashFiles('config/content.yaml') }}

      - name: Generate charts
        run: |
          make generate
          # Fail if generation produced an uncommitted diff (charts drifted).
          git diff --exit-code charts/ RULES.md || {
            echo "::error::Generated charts/RULES.md are out of date. Run 'make generate' and commit.";
            exit 1;
          }

      - name: Helm lint
        run: make lint

      - name: Helm unittest
        run: make test

      - name: Install ignition-validate
        env:
          # renovate: datasource=github-releases depName=coreos/ignition
          IGNITION_VERSION: v2.27.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ignition-validate" \
            "https://github.com/coreos/ignition/releases/download/$IGNITION_VERSION/ignition-validate-x86_64-linux"
          sudo install -m 0755 "$RUNNER_TEMP/ignition-validate" /usr/local/bin/ignition-validate
          ignition-validate --version

      - name: Python unit tests
        run: make test-py

      - name: Validate rendered payloads
        run: make validate-payloads
