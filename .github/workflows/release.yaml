name: release

# Manual releases only: charts/ is generated, so a release must always start
# from a state where `make generate` has run and its output is committed. The
# workflow verifies exactly that (drift check) before semantic-release cuts a
# version from the conventional-commit history (fix -> patch, feat -> minor).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Charts are pushed under this OCI repo prefix: <PREFIX>/<chart-name>.
  OCI_PREFIX: ghcr.io/slauger/charts

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # semantic-release pushes the tag + GitHub release
      packages: write     # push OCI artifacts to ghcr.io
      id-token: write     # cosign keyless (Sigstore OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # semantic-release needs the full history + tags

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install generator + dev deps
        run: pip install -e '.[dev]'

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.0

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest

      - name: Install helm-docs
        run: |
          curl -sSLo /tmp/helm-docs.tar.gz \
            https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz
          sudo tar -xzf /tmp/helm-docs.tar.gz -C /usr/local/bin helm-docs

      - name: Cache upstream content tarball
        uses: actions/cache@v6
        with:
          path: .cache
          key: sscg-${{ hashFiles('config/content.yaml') }}

      - name: Verify charts are current and green
        run: |
          make generate
          git diff --exit-code charts/ RULES.md || {
            echo "::error::Generated charts/RULES.md are out of date. Run 'make generate', commit, then release.";
            exit 1;
          }
          make lint
          make test
          make test-py

      # Computes the next version from conventional commits, writes it to
      # VERSION, regenerates charts/ + docs (exec plugin), commits the result
      # back to main (git plugin), tags and creates the GitHub release.
      - name: Semantic release
        id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: steps.semrel.outputs.new_release_published == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Install syft (SBOM)
        if: steps.semrel.outputs.new_release_published == 'true'
        uses: anchore/sbom-action/download-syft@v0

      # helm reads its own registry config; cosign/syft read the Docker config.
      # Log in to both, or signing fails after the push (UNAUTHORIZED).
      - name: Log in to GHCR
        if: steps.semrel.outputs.new_release_published == 'true'
        run: |
          helm registry login "$REGISTRY" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Package, push, sign, SBOM
        if: steps.semrel.outputs.new_release_published == 'true'
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          VERSION="${{ steps.semrel.outputs.new_release_version }}"

          # The charts already carry the released version: semantic-release's
          # exec plugin regenerated them from the VERSION file before tagging.

          # Umbrella needs its subchart dependencies built first.
          helm dependency build charts/compliance-hardening

          for chart in compliance-platform compliance-node compliance-hardening; do
            echo "== packaging $chart $VERSION =="
            helm package "charts/$chart" --version "$VERSION" -d dist/

            # Push and capture the pushed digest for signing.
            helm push "dist/${chart}-${VERSION}.tgz" "oci://${OCI_PREFIX}" 2>&1 | tee push.txt
            DIGEST="$(grep -oE 'sha256:[0-9a-f]{64}' push.txt | head -1)"
            REF="${OCI_PREFIX}/${chart}@${DIGEST}"
            echo "pushed $REF"

            # Keyless cosign signature (Sigstore OIDC via id-token).
            cosign sign "$REF"

            # SBOM (SPDX) + attach as an attestation.
            syft "dist/${chart}-${VERSION}.tgz" -o spdx-json > "sbom-${chart}.spdx.json"
            cosign attest --predicate "sbom-${chart}.spdx.json" --type spdxjson "$REF"
          done

      - name: Upload SBOMs as build artifacts
        if: steps.semrel.outputs.new_release_published == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sboms
          path: sbom-*.spdx.json
