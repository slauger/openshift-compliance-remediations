name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Chart version to publish (without leading v), e.g. 0.1.0"
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Charts are pushed under this OCI repo prefix: <PREFIX>/<chart-name>.
  OCI_PREFIX: ghcr.io/slauger/charts

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push OCI artifacts to ghcr.io
      id-token: write       # cosign keyless (Sigstore OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0

      - name: Log in to GHCR
        run: helm registry login "$REGISTRY" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Package, push, sign, SBOM
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"

          # Umbrella needs its subchart dependencies built first.
          helm dependency build charts/compliance-hardening

          for chart in compliance-platform compliance-node compliance-hardening; do
            echo "== packaging $chart $VERSION =="
            helm package "charts/$chart" --version "$VERSION" --app-version "$VERSION" -d dist/

            # Push and capture the pushed digest for signing.
            helm push "dist/${chart}-${VERSION}.tgz" "oci://${OCI_PREFIX}" 2>&1 | tee push.txt
            DIGEST="$(grep -oE 'sha256:[0-9a-f]{64}' push.txt | head -1)"
            REF="${OCI_PREFIX}/${chart}@${DIGEST}"
            echo "pushed $REF"

            # Keyless cosign signature (Sigstore OIDC via id-token).
            cosign sign "$REF"

            # SBOM (SPDX) + attach as an attestation.
            syft "dist/${chart}-${VERSION}.tgz" -o spdx-json > "sbom-${chart}.spdx.json"
            cosign attest --predicate "sbom-${chart}.spdx.json" --type spdxjson "$REF"
          done

      - name: Upload SBOMs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: sbom-*.spdx.json
