name: regenerate-charts

# When the pinned upstream content version changes on main (e.g. after merging a
# Renovate bump), refresh the checksum, regenerate the charts + RULES.md, and
# open (or update) a pull request on a fixed branch with the result. Keeps the
# generated artifacts in sync with config/content.yaml without postUpgradeTasks
# (which do not run on hosted Renovate).

on:
  push:
    branches: [main]
    paths:
      - config/content.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the update branch
      pull-requests: write   # open/update the PR
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install generator + dev deps
        run: pip install -e '.[dev]'

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.0

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest

      - name: Refresh checksum + regenerate + verify
        run: |
          make update-sha
          make verify

      - name: Open/update pull request with regenerated charts
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update-compliance-rules
          base: main
          title: "Regenerate charts for updated compliance content"
          commit-message: "chore: regenerate charts + RULES.md for updated content"
          body: |
            Automated regeneration triggered by a change to `config/content.yaml`.

            This refreshes the pinned `sha512`, regenerates `charts/` and
            `RULES.md`, and passes `make verify`. Review the diff of `charts/`
            and `RULES.md`: it shows exactly which rules and fixes changed
            between content releases.
          add-paths: |
            config/content.yaml
            charts/**
            RULES.md
          delete-branch: false
